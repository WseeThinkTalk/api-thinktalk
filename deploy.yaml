apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ${APP_NAMESPACE}
  labels:
    version: v1
    app: thinktalk-api
    app.kubernetes.io/version: v1
    app.kubernetes.io/name: thinktalk-api
  name: thinktalk-api-v1
  annotations:
    servicemesh.kubesphere.io/enabled: 'true'
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      version: v1
      app: thinktalk-api
      app.kubernetes.io/version: v1
      app.kubernetes.io/name: thinktalk-api
  template:
    metadata:
      labels:
        version: v1
        app: thinktalk-api
        app.kubernetes.io/version: v1
        app.kubernetes.io/name: thinktalk-api
      annotations:
        sidecar.istio.io/inject: 'true'
    spec:
      containers:
        - name: thinktalk-api
          imagePullPolicy: Always
          image: ${IMAGE}
          ports:
            - name: http-api
              protocol: TCP
              containerPort: 8888
          env:
            - name: ENV
              value: ${ENV_NAME}
      serviceAccount: default
      affinity: {}
      initContainers: []
      volumes: []
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
---
apiVersion: v1
kind: Service
metadata:
  namespace: ${APP_NAMESPACE}
  labels:
    version: v1
    app: thinktalk-api
    app.kubernetes.io/version: v1
    app.kubernetes.io/name: thinktalk-api
  annotations:
    kubesphere.io/serviceType: statelessservice
    servicemesh.kubesphere.io/enabled: 'true'
  name: thinktalk-api
spec:
  sessionAffinity: None
  selector:
    app: thinktalk-api
    app.kubernetes.io/version: v1
    app.kubernetes.io/name: thinktalk-api
  ports:
    - name: http-api
      protocol: TCP
      port: 8888
      targetPort: 8888
